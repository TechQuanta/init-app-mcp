name: CI

on:
  push:
    branches: [main, feat]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install ".[dev]"
      - name: Compile source
        run: python -m py_compile src/init_app_mcp/__init__.py src/init_app_mcp/catalog.py src/init_app_mcp/service.py src/init_app_mcp/server.py
      - name: Run tests
        run: python -m pytest
      - name: Verify package build
        run: python -m pip wheel . --no-deps --wheel-dir dist
