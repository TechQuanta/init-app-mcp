[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "init-app-mcp"
version = "0.1.0"
description = "Independent FastMCP server for metadata and init-app command recommendations."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "TechQuanta"}]
keywords = ["mcp", "fastmcp", "init-app", "scaffolding", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "fastmcp>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/ashmeet07/init-app-mcp"
Repository = "https://github.com/ashmeet07/init-app-mcp"
Issues = "https://github.com/ashmeet07/init-app-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
init-app-mcp = "init_app_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
